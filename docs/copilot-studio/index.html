<!doctype html>
<html lang="pt-BR" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Copilot Studio | Frontier Transformation Engineer</title>
    <meta
      name="description"
      content="Governança de agentes, calculadoras Standard e GitHub Copilot Harness, e referências selecionadas Microsoft."
    />
    <link
      rel="canonical"
      href="https://felipeneivadc.github.io/frontier-transformation-engineer/copilot-studio/"
    />
    <link rel="icon" href="../assets/images/logo.png" />
    <script src="../assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/hubs.css" />
    <script src="../assets/js/site.js" defer></script>
    <script src="../assets/js/hubs.js" type="module"></script>
  </head>
  <body data-page="studio" data-hub="studio">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div data-site-header></div>
    <noscript
      ><nav class="fallback-nav" aria-label="Navegação">
        <a href="../">Início</a><a href="governanca/">Guia de governança</a
        ><a href="../ferramentas/calculadora-creditos/">Calculadora</a>
      </nav></noscript
    >
    <main id="main-content" class="site-container page-shell" tabindex="-1">
      <p class="page-breadcrumb">
        <a href="../">Início</a><span aria-hidden="true">/</span>Copilot Studio
      </p>
      <header class="hub-heading">
        <img
          src="../assets/images/copilot-studio.png"
          alt=""
          width="56"
          height="56"
        />
        <div>
          <h1>Copilot Studio</h1>
          <p>
            Governar agentes e planejar consumo, com materiais NEIVA e fontes
            oficiais.
          </p>
        </div>
      </header>
      <div class="search-row">
        <label class="search-field"
          ><span class="sr-only">Buscar recursos</span
          ><input
            id="resourceSearch"
            type="search"
            placeholder="Buscar guia, calculadora ou referência…" /></label
        ><span
          id="resourceCount"
          class="eyebrow-small"
          aria-live="polite"
        ></span>
      </div>
      <section
        id="hubResources"
        aria-label="Recursos de Copilot Studio"
      ></section>
      <noscript
        ><p>
          Ative JavaScript para filtrar o catálogo.
          <a href="governanca/">Leia o guia de governança</a> ou
          <a href="../ferramentas/calculadora-creditos/">abra a calculadora</a>.
        </p></noscript
      >
    </main>
    <div data-site-footer></div>
    <div
      class="site-status"
      id="siteStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </body>
</html>
