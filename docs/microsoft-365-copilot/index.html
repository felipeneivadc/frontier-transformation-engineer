<!doctype html>
<html lang="pt-BR" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Microsoft 365 e Cowork | Frontier Transformation Engineer</title>
    <meta
      name="description"
      content="Planejamento de Copilot Cowork por perfil e intensidade, com referências de licenciamento e Copilot Credits."
    />
    <link
      rel="canonical"
      href="https://felipeneivadc.github.io/frontier-transformation-engineer/microsoft-365-copilot/"
    />
    <link rel="icon" href="../assets/images/logo.png" />
    <script src="../assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/hubs.css" />
    <script src="../assets/js/site.js" defer></script>
    <script src="../assets/js/hubs.js" type="module"></script>
  </head>
  <body data-page="m365" data-hub="m365">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div data-site-header></div>
    <noscript
      ><nav class="fallback-nav" aria-label="Navegação">
        <a href="../">Início</a><a href="../copilot-studio/">Copilot Studio</a
        ><a href="../ferramentas/calculadora-creditos/?products=cowork"
          >Calculadora Cowork</a
        >
      </nav></noscript
    >
    <main id="main-content" class="site-container page-shell" tabindex="-1">
      <p class="page-breadcrumb">
        <a href="../">Início</a><span aria-hidden="true">/</span>Microsoft 365 e
        Cowork
      </p>
      <header class="hub-heading">
        <img
          src="../assets/images/Coworking.png"
          alt=""
          width="56"
          height="56"
        />
        <div>
          <h1>Microsoft 365 e Cowork</h1>
          <p>
            Perfis, faixas de consumo e referências para planejamento de Copilot
            Credits.
          </p>
        </div>
      </header>
      <div class="search-row">
        <label class="search-field"
          ><span class="sr-only">Buscar recursos</span
          ><input
            id="resourceSearch"
            type="search"
            placeholder="Buscar calculadora ou referência…" /></label
        ><span
          id="resourceCount"
          class="eyebrow-small"
          aria-live="polite"
        ></span>
      </div>
      <section
        id="hubResources"
        aria-label="Recursos de Microsoft 365 e Cowork"
      ></section>
      <noscript
        ><p>
          Ative JavaScript para filtrar o catálogo.
          <a href="../ferramentas/calculadora-creditos/?products=cowork"
            >Abra a calculadora de Cowork</a
          >.
        </p></noscript
      >
    </main>
    <div data-site-footer></div>
    <div
      class="site-status"
      id="siteStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </body>
</html>
