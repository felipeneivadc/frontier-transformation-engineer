<!doctype html>
<html lang="pt-BR" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Ferramentas e diagnóstico | Frontier Transformation Engineer</title>
    <meta
      name="description"
      content="Diagnósticos, oficina de descoberta e estimativas para decidir como transformar desafios em experiências agênticas responsáveis."
    />
    <link
      rel="canonical"
      href="https://felipeneivadc.github.io/frontier-transformation-engineer/ferramentas/"
    />
    <link rel="icon" href="../assets/images/logo.png" />
    <script src="../assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/hubs.css" />
    <script src="../assets/js/site.js" defer></script>
    <script src="../assets/js/hubs.js" type="module"></script>
  </head>
  <body data-page="tools" data-hub="tools">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div data-site-header></div>
    <noscript>
      <nav class="fallback-nav" aria-label="Navegação">
        <a href="../">Início</a
        ><a href="calculadora-creditos/">Estimador de créditos</a
        ><a href="agent-advisor/">Agent Advisor</a
        ><a href="ai-discovery-studio/">AI Discovery Studio</a>
      </nav>
    </noscript>
    <main id="main-content" class="site-container page-shell" tabindex="-1">
      <p class="page-breadcrumb">
        <a href="../">Início</a><span aria-hidden="true">/</span>Ferramentas e
        diagnóstico
      </p>
      <header class="hub-heading">
        <img src="../assets/images/logo.png" alt="" width="56" height="56" />
        <div>
          <h1>Ferramentas e diagnóstico</h1>
          <p>
            Encontre um caminho, estruture a descoberta e estime o consumo antes
            de avançar.
          </p>
        </div>
      </header>
      <div class="search-row">
        <label class="search-field"
          ><span class="sr-only">Buscar ferramentas</span
          ><input
            id="resourceSearch"
            type="search"
            placeholder="Buscar diagnóstico, oficina ou estimador..." /></label
        ><span
          id="resourceCount"
          class="eyebrow-small"
          aria-live="polite"
        ></span>
      </div>
      <section
        id="hubResources"
        aria-label="Ferramentas e diagnóstico"
      ></section>
      <noscript>
        <p>
          Ative JavaScript para filtrar o catálogo.
          <a href="agent-advisor/">Abra o Agent Advisor</a>,
          <a href="ai-discovery-studio/">inicie o AI Discovery Studio</a> ou
          <a href="calculadora-creditos/">use o estimador de créditos</a>.
        </p>
      </noscript>
    </main>
    <div data-site-footer></div>
    <div
      class="site-status"
      id="siteStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </body>
